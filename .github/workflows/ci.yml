# Runs on every push and pull request: code checks (ruff) and the fast tests.
# No PyTorch and no data here, so the golden 2020 test and the real-data split
# tests skip themselves; run the full suite locally with `.venv\Scripts\python -m pytest`.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install (no ML stack)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q -rs
