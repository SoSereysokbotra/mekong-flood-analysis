[project]
name = "mfi"
version = "0.0.1"
description = "Mekong Flood Intelligence - SAR flood detection with flooded-vegetation focus"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pystac-client",
    "planetary-computer",
    "xarray",
    "rioxarray",
    "scikit-learn",
    "scikit-image",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
ml = ["torchgeo", "segmentation-models-pytorch"]
dev = ["pytest", "ruff", "jupyter", "ipykernel"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the local radar cache and model checkpoints; skips itself when they are missing"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pyflakes (F), pycodestyle errors/warnings (E, W), bugbear (B: likely bugs), import order (I)
select = ["E", "F", "W", "B", "I"]
# style-only, revisit in Phase 2: long lines, short names like `l`, zip(strict=)
ignore = ["E501", "E741", "B905"]

[tool.ruff.lint.per-file-ignores]
# B023 checked by hand 8 Nov 2026: each closure is called in the same loop iteration it is defined in
"scripts/level1_label_brightness.py" = ["B023"]
"scripts/level4_hidden_water_feasibility.py" = ["B023"]
"scripts/level4_normal_years.py" = ["B023"]
