[project]
name = "mfi"
version = "0.0.1"
description = "Mekong Flood Intelligence - SAR flood detection with flooded-vegetation focus"
requires-python = ">=3.10"
dependencies = [
    "numpy<2",
    "rasterio",
    "geopandas",
    "shapely",
    "pyproj",
    "pystac-client",
    "planetary-computer",
    "xarray",
    "rioxarray",
    "scikit-learn",
    "scikit-image",
    "matplotlib",
    "pyyaml",
    "tqdm",
    "requests",
]

[project.optional-dependencies]
ml = ["torchgeo", "segmentation-models-pytorch"]
dev = ["pytest", "jupyter", "ipykernel"]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
